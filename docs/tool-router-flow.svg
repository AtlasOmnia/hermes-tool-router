<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How Hermes Tool Router works</title>
  <desc id="desc">The first user turn is classified by local deterministic rules and, optionally, a small classifier. Confident routes send a narrowed tool schema to the main model. Uncertain or failed routes keep the full schema. Missing toolsets are added permanently for the session through automatic middleware recovery or the request_toolset fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111f38"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182641"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#fbbf24"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:40px;font-weight:800;fill:#f4f7ff;letter-spacing:-1.5px}
      .subtitle{font-size:18px;font-weight:400;fill:#a9bad3}
      .step{font-size:13px;font-weight:800;fill:#7dd3fc;letter-spacing:1.2px}
      .label{font-size:20px;font-weight:700;fill:#f4f7ff}
      .body{font-size:15px;font-weight:400;fill:#a9bad3}
      .small{font-size:13px;font-weight:600;fill:#c8d5e8}
      .pill{font-size:13px;font-weight:700}
      .card{fill:url(#card);stroke:#30415f;stroke-width:1.5;filter:url(#shadow)}
      .greenCard{fill:#0d302d;stroke:#34d399;stroke-width:1.7;filter:url(#shadow)}
      .amberCard{fill:#382a0e;stroke:#fbbf24;stroke-width:1.7;filter:url(#shadow)}
      .blueLine{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
      .greenLine{stroke:#34d399;stroke-width:3;fill:none;marker-end:url(#arrowGreen)}
      .amberLine{stroke:#fbbf24;stroke-width:3;fill:none;marker-end:url(#arrowAmber)}
      .dashLine{stroke:#7dd3fc;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="105" cy="72" r="215" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1095" cy="704" r="250" fill="#34d399" opacity="0.06"/>

  <text x="52" y="66" class="title">How Hermes Tool Router works</text>
  <text x="54" y="98" class="subtitle">Shrink the first provider request when confidence is high. Keep every tool when it is not.</text>

  <!-- Primary routing flow -->
  <rect x="52" y="154" width="178" height="118" rx="18" class="card"/>
  <text x="76" y="182" class="step">01 · INPUT</text>
  <text x="76" y="216" class="label">First user turn</text>
  <text x="76" y="244" class="body">Classified once</text>

  <path d="M232 213 H286" class="blueLine"/>

  <rect x="300" y="136" width="254" height="154" rx="18" class="card"/>
  <text x="326" y="166" class="step">02 · ROUTE</text>
  <text x="326" y="200" class="label">Deterministic rules</text>
  <text x="326" y="228" class="body">Fast, local, zero model cost</text>
  <line x1="326" y1="246" x2="528" y2="246" stroke="#30415f"/>
  <text x="326" y="270" class="small">Optional classifier for ambiguous turns</text>

  <path d="M556 213 H610" class="blueLine"/>

  <rect x="624" y="136" width="220" height="154" rx="18" class="card"/>
  <text x="650" y="166" class="step">03 · DECIDE</text>
  <text x="650" y="200" class="label">Confidence gate</text>
  <text x="650" y="228" class="body">Known toolsets?</text>
  <text x="650" y="252" class="body">Valid output?</text>
  <text x="650" y="276" class="body">Above threshold?</text>

  <!-- Outcome branches -->
  <path d="M846 184 H900" class="greenLine"/>
  <text x="854" y="168" class="small" fill="#6ee7b7">YES</text>
  <rect x="914" y="126" width="234" height="118" rx="18" class="greenCard"/>
  <text x="940" y="156" class="step" fill="#6ee7b7">NARROW</text>
  <text x="940" y="190" class="label">Likely toolsets</text>
  <text x="940" y="218" class="body">+ request_toolset</text>

  <path d="M734 292 V342 H900" class="amberLine"/>
  <text x="754" y="324" class="small" fill="#fde68a">UNCERTAIN</text>
  <rect x="914" y="294" width="234" height="118" rx="18" class="amberCard"/>
  <text x="940" y="324" class="step" fill="#fde68a">FAIL OPEN</text>
  <text x="940" y="358" class="label">Full tool surface</text>
  <text x="940" y="386" class="body">No capability is removed</text>

  <!-- Merge into provider request -->
  <path d="M1148 185 H1172 V442 H790" class="greenLine"/>
  <path d="M1032 414 V466 H790" class="amberLine"/>

  <rect x="514" y="420" width="262" height="126" rx="18" class="card"/>
  <text x="540" y="450" class="step">04 · MAIN MODEL</text>
  <text x="540" y="484" class="label">Provider request</text>
  <text x="540" y="512" class="body">Receives the selected schema</text>
  <text x="540" y="536" class="body">and handles the task normally</text>

  <!-- Recovery loop -->
  <path d="M512 483 H374" class="dashLine"/>
  <rect x="52" y="408" width="306" height="150" rx="18" class="card"/>
  <text x="78" y="438" class="step">05 · RECOVER IF NEEDED</text>
  <text x="78" y="472" class="label">Add the missing toolset</text>
  <text x="78" y="500" class="body">Primary: automatic tool-request middleware</text>
  <text x="78" y="524" class="body">Fallback: visible request_toolset tool</text>
  <text x="78" y="548" class="small">Normal checks and approvals still apply</text>

  <path d="M205 560 V594 H645 V550" class="blueLine"/>
  <text x="318" y="586" class="small">Expansion is permanent for this session · tools are never re-pruned</text>

  <!-- Footer invariants -->
  <rect x="52" y="660" width="212" height="42" rx="21" fill="#0d302d" stroke="#34d399"/>
  <text x="79" y="686" class="pill" fill="#b7f7d8">FAIL-OPEN SAFETY</text>

  <rect x="282" y="660" width="212" height="42" rx="21" fill="#102d40" stroke="#7dd3fc"/>
  <text x="315" y="686" class="pill" fill="#c9f2ff">SESSION-STICKY</text>

  <rect x="512" y="660" width="212" height="42" rx="21" fill="#102d40" stroke="#7dd3fc"/>
  <text x="548" y="686" class="pill" fill="#c9f2ff">MONOTONIC GROWTH</text>

  <rect x="742" y="660" width="212" height="42" rx="21" fill="#102d40" stroke="#7dd3fc"/>
  <text x="787" y="686" class="pill" fill="#c9f2ff">PLUGIN-ONLY</text>

  <rect x="972" y="660" width="176" height="42" rx="21" fill="#382a0e" stroke="#fbbf24"/>
  <text x="994" y="686" class="pill" fill="#fde68a">OPT-IN CLASSIFIER</text>
</svg>
