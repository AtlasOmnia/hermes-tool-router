name: Bug report
description: Report a reproducible problem with Hermes Tool Router
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail for someone else to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Briefly describe the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps or commands that trigger the issue.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include logs or error messages if relevant.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which release, branch, or commit are you using?
      placeholder: v0.1.0 or commit SHA
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
        - Docker
        - Other
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste relevant config, with secrets removed.
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, tokens, keys, and private data from this report.
          required: true
